name: Prerender static routes

on:
  push:
    branches:
      - conflict_090426_1618
      - main
    paths:
      - "frontend/src/**"
      - "frontend/scripts/prerender.js"
      - "frontend/package.json"
      - "frontend/.gitignore"
      - ".github/workflows/prerender.yml"
      - "vercel.json"
  workflow_dispatch:

jobs:
  prerender:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Install Playwright + system deps
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build:only

      - name: Prerender
        working-directory: frontend
        run: node scripts/prerender.js

      - name: Commit prerendered HTML
        working-directory: frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f $(find build -name index.html) build/sitemap.xml
          git diff --cached --quiet || git commit -m "chore: update prerendered HTML [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} && git push && break
            echo "Push rejected, retrying ($i)..."
            sleep 5
          done
